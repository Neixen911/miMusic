[package]
name = "miMusic"
version = "0.1.0"
edition = "2024"

[dependencies]
archive = "0.3.0"
futures-util = "0.3.31"
id3 = "1.16.2"
rand = "0.8"
ratatui = "0.29.0"
reqwest = "0.13.2"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-mp3"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
symphonia = { version = "0.5.4", features = ["mp3"] }
tokio = { version = "1.46.1", features = ["macros", "rt-multi-thread", "sync"] }
